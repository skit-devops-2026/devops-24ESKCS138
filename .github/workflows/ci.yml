
# GitHub Actions CI workflow for the Kisan Market frontend.

name: CI

on:
  push:
  pull_request:

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run hygiene checks
        run: bash scripts/hygiene.sh

  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install
        run: make install

      - name: Test
        run: make test

      - name: Build
        run: make build

  docker:
    name: Build and push Docker image to GHCR
    runs-on: ubuntu-latest
    needs: [hygiene, build-and-test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
              ghcr.io/${{ github.repository_owner }}/devops-24eskcs138:latest
              ghcr.io/${{ github.repository_owner }}/devops-24eskcs138:${{ github.sha }}
