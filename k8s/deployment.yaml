
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kisan-market
  labels:
    app: kisan-market
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kisan-market
  template:
    metadata:
      labels:
        app: kisan-market
    spec:
      containers:
        - name: kisan-market
          image: hanumanart/kisan-market:1.1
          ports:
            - containerPort: 10000
          imagePullPolicy: Always
